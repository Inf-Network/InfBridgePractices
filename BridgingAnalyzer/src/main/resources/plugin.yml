name: BridgingAnalyzer
main: net.infnetwork.snowball.bridginganalyzer.BridgingAnalyzer
version: ${project.version}
author: SakuraKooi
api-version: '1.21'
depend: [Vault]
softdepend: [BlockLv]
commands:
  bridge:
    description: Bridging Analyzer Config
    usage: /bridge
  clearblock:
    description: clear placed block
    usage: /clearblock
  imstuck:
    description: destroy near block
    usage: /imstuck
  genvillager:
    description: create villager spawn point
    usage: /genvillager
  bsaveworld:
    description: save the world
    usage: /bsaveworld
  cd:
    description: 打开搭路练习菜单
    usage: /cd
    aliases: [bridgemenu]
  warpbridge:
    description: 打开搭路快捷传送菜单
    usage: /warpbridge
    aliases: [bridgewarp]
permissions:
  bridge.remove:
    description: 删除最近的村民训练靶刷新点
    default: op
  bridginganalyzer.noclear:
    default: op
  bridginganalyzer.clear:
    default: op
  bridginganalyzer.admin:
    default: op
  bridginganalyzer.menu.main:
    description: 打开搭路练习主菜单
    default: true
  bridginganalyzer.menu.warp:
    description: 打开搭路快捷传送菜单
    default: true
  bridginganalyzer.menu.item:
    description: 获得固定在快捷栏第九格的菜单入口
    default: true
