# Native replacement for the audited DeluxeMenus main.yml and warp.yml.
# Commands are intentionally dispatched through injected adapters; this file is never
# allowed to grant operator privileges or execute arbitrary menu-script syntax.
permissions:
  main: bridginganalyzer.menu.main
  warp: bridginganalyzer.menu.warp
  item: bridginganalyzer.menu.item

main:
  entries:
    clearblock:
      # 0 disables charging while keeping the action available.
      cost: 500

warp:
  title: '&a&l快捷传送'
  # Slots 4 and 49 are reserved for the profile and return buttons. Any other
  # slot in this 54-slot inventory may be used for future destinations.
  entries:
    spawn:
      slot: 11
      material: BEACON
      display-name: '&6主城'
      cost: 0
      lore:
        - '&8地标'
        - ''
        - '&e点击传送!'
      action:
        type: player-command
        command: spawn
    ceda:
      slot: 12
      material: SANDSTONE
      display-name: '&a侧搭/无限搭路区'
      cost: 100
      action:
        type: console-command
        command: 'warp ceda {player}'
    qiangda:
