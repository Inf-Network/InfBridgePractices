name: CpsCounter
main: net.infnetwork.snowball.cpscounter.CpsCounter
version: ${project.version}
author: SakuraKooi
api-version: '1.21'
commands:
  cps:
    description: get other player cps
    usage: /cps
permissions:
  cpscounter.cps:
    default: op
  cpscounter.bypass:
    description: Do not trigger automatic high-CPS warnings.
    default: op
  cpscounter.bypasslimit:
    description: Bypass the one-second CPS command cooldown.
    default: op
  cpscounter.monitor:
    description: Receive automatic high-CPS warnings.
    default: op
