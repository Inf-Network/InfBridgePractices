name: BridgingSkin
main: net.infnetwork.snowball.bridgingskin.BridgingSkin
version: ${project.version}
author: SakuraKooi
api-version: '1.21'
depend: ["BridgingAnalyzer", "Vault"]
softdepend: ["WorldEdit", "FastAsyncWorldEdit"]
commands:
  bskin:
    description: Choose your skin.
    usage: /bskin
  bskin-edit:
    description: Manage player block skins.
    usage: /bskin-edit <edit|clear>
  bskin-crate:
    description: Manage block-skin lottery crates.
    usage: /bskin-crate <set|remove|clear|clearall|info|list>
permissions:
  bridgingskin.skin.select:
    description: Open the block-skin selector.
    default: true
  bridgingSkin.admin:
    description: Edit or globally clear player block skins.
    default: op
  bridgingskin.admin.crate:
    description: Register or remove block-skin lottery crates.
    default: op
