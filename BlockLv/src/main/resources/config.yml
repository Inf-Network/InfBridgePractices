# BlockLv —— 搭路等级系统

# ─────────────────────────────────────────────────────────────
# 数据存储
#
#   sqlite      本地开发用。零配置,数据落在本目录的 blocklv.db。
#               驱动由 Paper 自带,不需要任何账号密码。
#
#   postgresql  生产用(Ubuntu 主服)。驱动由 plugin.yml 的 libraries 段
#               在启动时自动下载,Paper 不自带 PG 驱动。
#
# 部署到 Ubuntu 时:把 type 改成 postgresql,并把下面四个 CHANGE_ME 填掉。
# 占位符没替换时插件会拒绝启动并明确报错,不会拿着 CHANGE_ME 去瞎连。
#
# ⚠ 密码是凭据,填好之后这个文件就不要再提交进 git 了
#   (server-1.21.11/plugins/BlockLv/config.yml 已在 .gitignore 里排除)。
#
# 建表语句和读写 SQL 两边通用,切换后端不需要改代码。
# 从 sqlite 迁到 postgresql 的数据搬运见 docs/DEPLOY-UBUNTU.md。
# ─────────────────────────────────────────────────────────────
database:
  type: sqlite
  postgresql:
    host: CHANGE_ME
    port: 5432
    database: CHANGE_ME
    user: CHANGE_ME
    password: CHANGE_ME

# Top 10 排行榜全息的位置。与原服一致。
# 也可以进游戏站到目标位置执行 /blocklv setrank 就地设置。
rank:
  x: -188
  y: 45
  z: 1355
  world: world
