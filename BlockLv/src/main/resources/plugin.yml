name: BlockLv
version: ${project.version}
main: net.infnetwork.snowball.blocklv.BlockLv
author: luanmenglei
api-version: '1.21'
softdepend: ["PlaceholderAPI", "DecentHolograms"]
commands:
  blocklv:
    description: "main command"
    usage: "/blocklv <add|addlevel|decrease|decreaselevel|clear|setrank|refresh>"
permissions:
  blocklv.add:
    default: op
  blocklv.addlevel:
    description: "增加在线玩家的搭路等级并立即保存"
    default: op
  blocklv.decrease:
    description: "减少在线玩家的搭路进度，可跨级回退并立即保存"
    default: op
  blocklv.decreaselevel:
    description: "减少在线玩家的搭路等级并立即保存"
    default: op
  blocklv.clear:
    default: op
  blocklv.setrank:
    default: op
  blocklv.refresh:
    default: op
