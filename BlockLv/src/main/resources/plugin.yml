name: BlockLv
version: ${project.version}
main: net.infnetwork.snowball.blocklv.BlockLv
author: luanmenglei
api-version: '1.21'
softdepend: ["PlaceholderAPI", "DecentHolograms"]
# Paper supplies the PostgreSQL driver declared here at runtime.
libraries:
  - org.postgresql:postgresql:42.7.4
commands:
  blocklv:
    description: "main command"
    usage: "/blocklv <add|clear|setrank|refresh>"
permissions:
  blocklv.add:
    default: op
  blocklv.clear:
    default: op
  blocklv.setrank:
    default: op
  blocklv.refresh:
    default: op
